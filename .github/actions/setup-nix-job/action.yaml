name: Setup a job that uses Nix
description: A set of steps to setup a Github Actions job with Nix
inputs:
  git_https_token:
    description:
      Optional Github Access Token to rewrite git URLs to use HTTPS with
      authentication. If not provided, it will rewrite to standard HTTPS URLs
      without authentication.
    required: false
  nix_version:
    description: The version of Nix to install. Defaults to the latest stable version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ inputs.git_https_token || github.token }}
        submodules: recursive
        persist-credentials: false

    - name: Rewrite SSH → HTTPS git URLs
      shell: bash
      run: |
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

    - name: Setup credential helper for token authentication
      if: ${{ inputs.git_https_token }}
      shell: bash
      env:
        GIT_HTTPS_TOKEN: ${{ inputs.git_https_token }}
      run: |
        set -euo pipefail
        credentials_file="$RUNNER_TEMP/github-app-git-credentials"

        install -m 600 /dev/null "${credentials_file}"
        printf 'https://x-access-token:%s@github.com\n' "${GIT_HTTPS_TOKEN}" > "${credentials_file}"

        actual_size="$(wc -c < "${credentials_file}")"
        token_len="${#GIT_HTTPS_TOKEN}"
        echo "Credentials written: ${actual_size} bytes, token length=${token_len}, mode=$(stat --format='%a' "${credentials_file}")"

        git config --global --unset-all credential.helper || true
        git config --global credential.helper "store --file=$credentials_file"


    - name: Install Nix (specific version)
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      if: ${{ inputs.nix_version != '' }}
      with:
        nix_version: ${{ inputs.nix_version }}

    - name: Install Nix (latest stable)
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      if: ${{ inputs.nix_version == '' }}
