name: Nix Flake Check
on:
  workflow_call:
    inputs:
      timeout_minutes:
        required: false
        type: number
        default: 10
      nix_version:
        required: false
        type: string
        default: ""
      app_client_id:
        description: The Github App ClientID to authenticate with. If provided, it will
          be used to generate a token for git authentication.
        required: false
        type: string
        default: ""
      app_owner:
        description: If provided, the token will be issued for all repositories in the
          owner (user or organization). If not provided, the token will be
          issued for the repository of the workflow that calls this action.
        required: false
        type: string
        default: ""
      app_repositories:
        description: Comma or newline-separated list of repositories to grant the token
          access to (defaults to current repository if owner is unset)
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: The private key of the Github App, in PEM format. If provided, it
          will be used to generate a token for git authentication.
        required: false

jobs:
  nix-flake-check:
    timeout-minutes: ${{ inputs.timeout_minutes }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Github App info
        if: ${{ inputs.app_client_id != '' }}
        id: app_auth
        uses: pedorich-n/github-workflows/.github/actions/app-token@692bc85f75ce027e466132921917f8f9a4cc5057 # main
        with:
          client_id: ${{ inputs.app_client_id }}
          private_key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.app_owner }}
          repositories: ${{ inputs.app_repositories }}

      - name: Debug App token fingerprint
        shell: bash
        env:
          TOKEN: ${{ steps.app_auth.outputs.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | sha256sum | awk '{print "App token SHA-256=" $1}'
          printf '%s' "$TOKEN" | wc -c | awk '{print "App token length=" $1}'

      - name: Setup Nix
        uses: pedorich-n/github-workflows/.github/actions/setup-nix-job@dac49ab5da5ebe61bb68301696d2d5d6fdfa1901 # main
        with:
          nix_version: ${{ inputs.nix_version }}
          git_https_token: ${{ steps.app_auth.outputs.token }}

      - name: Verify GitHub App token repository access
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_auth.outputs.token }}
        run: |
          set -euo pipefail

          echo "Checking direct repository visibility:"
          gh api repos/pedorich-n/airtable-telegram-lessons \
            --jq '"repository=" + .full_name'

          echo "Checking repositories granted to this installation token:"
          gh api --paginate installation/repositories \
            --jq '.repositories[].full_name' |
            grep -Fx 'pedorich-n/airtable-telegram-lessons'

      - name: Verify private flake Git access
        shell: bash
        run: |
          set -euo pipefail

          echo "URL rewrites:"
          git config --global --get-all url."https://github.com/".insteadOf || true

          echo "Credential helpers:"
          git config --show-origin --get-all credential.helper || true

          echo "Checkout HTTP extraheaders (names only):"
          git config --local --name-only --get-regexp \
            '^http\..*\.extraheader$' || true

          test -s "$HOME/.git-credentials"
          stat --format='mode=%a size=%s bytes' "$HOME/.git-credentials"

          echo "Testing the exact SSH-form URL Nix uses:"
          GIT_TERMINAL_PROMPT=0 \
            git ls-remote \
              ssh://git@github.com/pedorich-n/airtable-telegram-lessons \
              HEAD


      - name: Nix Flake Check
        uses: pedorich-n/github-workflows/.github/actions/nix-flake-check@dac49ab5da5ebe61bb68301696d2d5d6fdfa1901 # main
